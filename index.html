<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المنارة — غرفة التسجيل وبوابة الطالب</title>
<style>
:root{
  --navy:#0B2A4A; --gold:#E8A317; --bg:#F7F8FA; --card:#FFFFFF; --tx:#14202E; --tx2:#5B6878;
  --bd:#E3E8EF; --ok:#1F9D55; --bad:#D64545; --warn:#B7791F; --soft:#EEF3F9;
}
[data-theme="dark"]{
  --navy:#0B2A4A; --gold:#F2B84B; --bg:#0E1520; --card:#16202E; --tx:#E8EDF4; --tx2:#9AA7B8;
  --bd:#243244; --ok:#3FB27F; --bad:#E46363; --warn:#E0A93B; --soft:#1B2635;
}
*{box-sizing:border-box}
body{margin:0;font-family:"IBM Plex Sans Arabic","Cairo",Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:15px}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
input,select,textarea{font-family:inherit;font-size:15px;width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);margin-top:4px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
label{font-size:13px;color:var(--tx2);display:block;margin-top:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--gold)}
.btn-p{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn-g{background:var(--gold);color:#1a1200;border-color:var(--gold)}
.btn-s{padding:6px 12px;font-size:13px;font-weight:500}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 auto}
.top{position:sticky;top:0;z-index:30;background:var(--navy);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px}
.logo .dot{width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold)}
.spacer{flex:1}
.iconbtn{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px}
.layout{display:flex;min-height:calc(100vh - 52px)}
.side{width:230px;flex:0 0 230px;background:var(--card);border-inline-end:1px solid var(--bd);padding:14px 10px}
.side a{display:block;padding:10px 12px;border-radius:10px;color:var(--tx2);font-weight:600;margin-bottom:2px}
.side a.on{background:var(--soft);color:var(--navy)}
[data-theme="dark"] .side a.on{color:var(--gold)}
.main{flex:1;padding:22px;max-width:1100px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:16px}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:17px;margin:0 0 12px}
h3{font-size:15px;margin:0 0 8px}
.mut{color:var(--tx2);font-size:13px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.kpi b{display:block;font-size:24px;margin-top:4px}
.tag{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--soft);color:var(--tx2)}
.tag.ok{background:rgba(31,157,85,.15);color:var(--ok)}
.tag.bad{background:rgba(214,69,69,.15);color:var(--bad)}
.tag.warn{background:rgba(183,121,31,.15);color:var(--warn)}
.tag.gold{background:rgba(232,163,23,.18);color:var(--warn)}
.bar{height:8px;border-radius:99px;background:var(--bd);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:start;padding:9px 8px;border-bottom:1px solid var(--bd);vertical-align:top}
th{color:var(--tx2);font-size:12px;font-weight:600}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:2px;font-weight:700;font-size:18px;background:var(--soft);padding:8px 12px;border-radius:8px;display:inline-block}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:13px}
.toast{position:fixed;inset-inline-start:16px;inset-block-end:16px;z-index:99;background:var(--card);border:1px solid var(--bd);border-inline-start:4px solid var(--gold);padding:12px 16px;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.15);max-width:420px}
.toast.bad{border-inline-start-color:var(--bad)}
.toast.ok{border-inline-start-color:var(--ok)}
.hidden{display:none!important}
.center{max-width:480px;margin:5vh auto;padding:0 14px}
.hero{background:linear-gradient(135deg,var(--navy),#123f6b);color:#fff;border-radius:16px;padding:26px;margin-bottom:18px}
.hero h1{color:#fff}
.hero .mut{color:rgba(255,255,255,.75)}
.lesson{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--bd);border-radius:10px;margin-bottom:8px;flex-wrap:wrap}
.hint{border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.7;margin:10px 0;border:1px solid var(--bd);background:var(--soft)}
.hint.good{border-color:rgba(31,157,85,.4);background:rgba(31,157,85,.08)}
.hint.dang{border-color:rgba(214,69,69,.4);background:rgba(214,69,69,.08)}
.diag{background:#fff4f4;border:1px solid #f3c2c2;color:#8a2020;border-radius:10px;padding:12px;margin:12px 0;font-family:ui-monospace,Menlo,monospace;font-size:12px;white-space:pre-wrap;word-break:break-all}
[data-theme="dark"] .diag{background:#2a1414;border-color:#5a2626;color:#ffb4b4}
.diag.ok{background:#f1faf3;border-color:#bfe6cc;color:#1d6b3f}
[data-theme="dark"] .diag.ok{background:#132a1c;border-color:#2c5a3c;color:#9be3b6}
#printArea{display:none}
@media print{
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{display:block;position:absolute;inset-block-start:0;inset-inline-start:0;width:100%;padding:20px}
  .pcard{border:2px solid #000;padding:14px;margin:10px;page-break-inside:avoid;width:220px;display:inline-block;text-align:center}
  .pcard .c{font-family:monospace;font-size:22px;letter-spacing:3px;font-weight:700;margin:10px 0}
}
@media(max-width:760px){.side{display:none}.main{padding:14px}}
</style>
</head>

var lang = LS.get('mn_lang','ar');
var theme = LS.get('mn_theme','light');
function t(k){ var d=I18N.ar[k]; var v=I18N[lang] && I18N[lang][k]; return (v===undefined? d : v); }

/* ------------------------------------------------------- الحالة العامة ------- */
var cfg = LS.get('mn_cfg', null);
var token = null;
var S = { session:null, profile:null, roles:[], route:'home', authMode:'login',
          codes:[], lastStudent:null, findEmail:'', userQuery:'' };

function applyChrome(){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang==='ar'?'rtl':'ltr';
  document.documentElement.dataset.theme = theme;
}
function toast(msg,kind){
  var d=document.createElement('div');
  d.className='toast '+(kind||'');
  d.textContent=msg;
  $('#toasts').appendChild(d);
  setTimeout(function(){ d.style.opacity='0'; d.style.transition='opacity .4s'; setTimeout(function(){ d.remove(); },400); }, 4200);
}
var ERRS = {
  student_not_found:'الطالب غير مسجّل — تأكد من البريد',

  code_not_for_this_student:'هذا الكود مرتبط بطالب آخر',
  code_expired:'انتهت صلاحية هذا الكود',

  payment_not_found:'سجل الدفع غير موجود',

  code_not_cancellable:'لا يمكن إلغاء كود مستخدم',

  immutable_record:'سجل محمي — لا يمكن التعديل',
  user_already_exists:'هذا البريد مسجّل بالفعل'
};
function errMsg(e){
  var m = (e && (e.code || e.message)) || '';
  if(ERRS[m]) return ERRS[m];
  if(String(m).indexOf('Failed to fetch')>=0) return 'تعذّر الوصول للسيرفر — تحقّق من الإنترنت أو من المفاتيح';
  return m || t('err');
}

/* ==============================================================
   طبقة الاتصال — كلها بـ fetch مباشرة، بلا مكتبات خارجية
   ============================================================== */
function api(path, opt){
  opt = opt || {};
  var h = { 'apikey': cfg.anon, 'Content-Type':'application/json' };
  if(opt.auth !== false && token) h['Authorization'] = 'Bearer ' + token;
  if(opt.headers){ for(var k in opt.headers) h[k]=opt.headers[k]; }

  return fetch(cfg.url.replace(/\/+$/,'') + path, {
    method: opt.method || 'GET',
    headers: h,
    body: opt.body ? JSON.stringify(opt.body) : undefined
  }).then(function(r){
    return r.text().then(function(txt){
      var j = null;
      if(txt){ try{ j = JSON.parse(txt); }catch(e){ j = { message: txt.slice(0,300) }; } }
      if(!r.ok){
        var m = (j && (j.message || j.msg || j.error_description || j.error)) || ('HTTP ' + r.status);
        var err = new Error(m);
        err.code = (j && j.code) || m;
        err.status = r.status;
        throw err;
      }
      return j;
    });
  });
}

function setSession(j){
  token = j.access_token || null;
  LS.set('mn_session', { access_token:j.access_token, refresh_token:j.refresh_token, user:j.user });
}
function clearSession(){
  token = null; LS.del('mn_session');
  S.session=null; S.profile=null; S.roles=[];
}
var Auth = {
  signUp: function(email,password,fullName){
    return api('/auth/v1/signup',{method:'POST',auth:false,
      body:{ email:email, password:password, data:{ full_name:fullName } }})
      .then(function(j){ if(j.access_token) setSession(j); return j; });
  },
  signIn: function(email,password){
    return api('/auth/v1/token?grant_type=password',{method:'POST',auth:false,
      body:{ email:email, password:password }})
      .then(function(j){ setSession(j); return j; });
  },
  recover: function(email){ return api('/auth/v1/recover',{method:'POST',auth:false,body:{email:email}}); },
  logout: function(){ return api('/auth/v1/logout',{method:'POST'}).catch(function(){}).then(clearSession); },
  me: function(){ return api('/auth/v1/user'); },
  update: function(body){ return api('/auth/v1/user',{method:'PUT',body:body}).then(function(j){ if(j.access_token) setSession(j); return j; }); }
};
var db = {
  select: function(table,q){ return api('/rest/v1/'+table+'?select=*'+(q?('&'+q):'')); },
  one:    function(table,q){ return api('/rest/v1/'+table+'?select=*'+(q?('&'+q):'')).then(function(a){ return (a&&a[0])||null; }); },
  update: function(table,q,body){ return api('/rest/v1/'+table+'?'+q,{method:'PATCH',body:body,headers:{Prefer:'return=minimal'}}); },
  rpc:    function(name,args){ return api('/rest/v1/rpc/'+name,{method:'POST',body:args||{}}); }
};
function inList(arr){ return '(' + arr.join(',') + ')'; }

/* ============================================================== */
function renderSetup(){
  $('#app').innerHTML =
  '<div class="center">'+
    '<div class="hero" style="text-align:center">'+
      '<div class="logo" style="justify-content:center;color:#fff"><span class="dot"></span>'+esc(t('appName'))+'</div>'+
      '<p class="mut" style="margin:6px 0 0">'+esc(t('tagline'))+'</p>'+
    '</div>'+
    '<div class="card">'+
      '<h1>'+esc(t('setupTitle'))+'</h1>'+
      '<p class="mut">'+esc(t('setupHint'))+'</p>'+
      '<div class="hint good">✅ انسخ <b>Publishable key</b> — اللي بيبدأ بـ <span class="mono">sb_publishable_…</span></div>'+
      '<div class="hint dang">❌ متنسخش <b>Secret key</b> أبداً — اللي بيبدأ بـ <span class="mono">sb_secret_…</span> (ده بيفتح كل حاجة من غير حماية)</div>'+
      '<div id="setup_diag"></div>'+
      '<label>'+esc(t('url'))+'</label>'+
      '<input id="s_url" placeholder="https://xxxxxxxx.supabase.co" value="'+esc(cfg?cfg.url:'')+'">'+
      '<label>'+esc(t('anon'))+'</label>'+
      '<input id="s_key" placeholder="sb_publishable_…" value="'+esc(cfg?cfg.anon:'')+'">'+
      '<p class="mut" style="margin-top:10px">'+esc(t('setupNote'))+'</p>'+
      '<div class="row" style="margin-top:14px">'+
        '<button class="btn btn-p grow" id="s_go">'+esc(t('save'))+'</button>'+
        '<button class="btn" id="s_test">'+esc(t('test'))+'</button>'+
      '</div>'+
    '</div>'+
  '</div>';

  $('#s_test').onclick = function(){
    var u=$('#s_url').value.trim(), k=$('#s_key').value.trim();
    var box=$('#setup_diag');
    if(!u||!k){ box.innerHTML='<div class="diag">املأ الخانتين أولاً</div>'; return; }
    box.innerHTML='<div class="mut">جارٍ الاختبار…</div>';
    fetch(u.replace(/\/+$/,'')+'/rest/v1/app_settings?select=key',{headers:{'apikey':k}})
      .then(function(r){ return r.text().then(function(x){
        box.innerHTML = r.ok
          ? '<div class="diag ok">✅ الاتصال ناجح — القيمتين صح. دوس "حفظ وبدء".</div>'
          : '<div class="diag">الاتصال فشل ('+r.status+')\n'+x.slice(0,400)+'</div>';
      });})
      .catch(function(e){ box.innerHTML='<div class="diag">فشل الوصول:\n'+esc(String(e))+'</div>'; });
  };

  $('#s_go').onclick = function(){
    var url=$('#s_url').value.trim().replace(/\/+$/,''), anon=$('#s_key').value.trim();
    if(!url||!anon) return toast(t('err'),'bad');
    if(!/^https:\/\//i.test(url)) return toast('Project URL شكله غلط','bad');
    if(anon.indexOf('sb_secret')===0) return toast('ده المفتاح السري — استخدم Publishable key','bad');
    if(anon.indexOf('sb_publishable_')!==0 && anon.indexOf('eyJ')!==0)
      return toast('المفتاح شكله غلط — لازم يبدأ بـ sb_publishable_ أو eyJ','bad');
    LS.set('mn_cfg',{url:url,anon:anon}); cfg={url:url,anon:anon};
    boot();
  };
}

  var mode = S.authMode||'login';
  $('#app').innerHTML =
  '<div class="center">'+
    '<div class="hero" style="text-align:center">'+
      '<div class="logo" style="justify-content:center;color:#fff"><span class="dot"></span>'+esc(t('appName'))+'</div>'+
      '<p class="mut" style="margin:6px 0 0">'+esc(t('tagline'))+'</p>'+
    '</div>'+

        .then(function(j){

          }
          if(phone){
            return db.update('profiles','id=eq.'+j.user.id,{phone:phone}).catch(function(){}).then(done);
          }
          return done();
        }).catch(fail);
    }else{
      Auth.signIn(email,pwd).then(done).catch(fail);

    };

function loadMe(){
  var saved = LS.get('mn_session', null);
  if(!saved || !saved.access_token){ clearSession(); return Promise.resolve(); }
  token = saved.access_token;
  return Auth.me().then(function(u){
    S.session = { user:u };
    var p = db.one('profiles','id=eq.'+u.id).catch(function(){ return null; });
    var r = db.select('user_roles','user_id=eq.'+u.id).catch(function(){ return []; });
    return Promise.all([p,r]).then(function(res){
      S.profile = res[0] || { id:u.id, full_name:(u.email||'').split('@')[0], status:'active' };
      S.roles = (res[1]||[]).map(function(x){ return x.role; });
      if(S.roles.indexOf('student')<0) S.roles.push('student');
    });
  }).catch(function(){
    clearSession();
  });
}

function viewCourse(id){
  return Promise.all([
    db.one('courses','id=eq.'+id),

    db.rpc('my_library').catch(function(){ return []; })

    var c=res[0], subs=res[1]||[], lib=res[2]||[];

    var ownedCourse = lib.some(function(r){ return r.course_id===id; });

      '<div class="card" style="margin-top:12px">'+

        '<h1 style="margin-top:8px">'+esc(lang==='ar'?c.title_ar:(c.title_en||c.title_ar))+'</h1>'+
        '<p class="mut">'+esc(lang==='ar'?c.desc_ar:(c.desc_en||c.desc_ar))+'</p></div>'+
      '<h2>'+esc(t('subject'))+'</h2>'+
      subs.map(function(s){

        return '<div class="lesson"><div class="grow"><b>'+esc(lang==='ar'?s.title_ar:(s.title_en||s.title_ar))+'</b></div>'+
          (has ? '<a class="btn btn-s btn-p" href="#/subject/'+s.id+'">'+esc(t('open'))+'</a>'
               : '<span class="tag lock">🔒 '+esc(t('locked'))+'</span>')+

  });

function viewSubject(id){
  return Promise.all([
    db.one('subjects','id=eq.'+id),
    db.select('units','subject_id=eq.'+id+'&order=sort_order')
  ]).then(function(res){
    var s=res[0], units=res[1]||[];
    if(!s) return '<div class="card">'+esc(t('notFound'))+'</div>';
    if(!units.length) return '<div class="card mut">لا توجد وحدات بعد</div>';
    return db.select('lessons','unit_id=in.'+inList(units.map(function(u){return u.id;}))+'&status=eq.published&order=sort_order')
      .then(function(lessons){
        lessons=lessons||[];
        return db.select('lesson_progress').then(function(prog){
          prog=prog||[];
          var pm={}; prog.forEach(function(p){ pm[p.lesson_id]=p; });
          var un={}; units.forEach(function(u){ un[u.id]=lang==='ar'?u.title_ar:(u.title_en||u.title_ar); });
          var done=lessons.filter(function(l){ return pm[l.id]&&pm[l.id].completed_at; }).length;
          var pct = lessons.length?Math.round(done*100/lessons.length):0;
          return '<div class="row"><a class="btn btn-s" href="#/course/'+s.course_id+'">← '+esc(t('back'))+'</a></div>'+
            '<div class="card" style="margin-top:12px">'+
              '<h1>'+esc(lang==='ar'?s.title_ar:(s.title_en||s.title_ar))+'</h1>'+
              '<div class="row" style="margin-top:8px"><div class="bar grow"><i style="width:'+pct+'%"></i></div>'+
              '<span class="mut">'+done+'/'+lessons.length+'</span></div></div>'+
            lessons.map(function(l){
              var d=pm[l.id];
              return '<div class="lesson"><div class="grow"><b>'+esc(lang==='ar'?l.title_ar:(l.title_en||l.title_ar))+'</b>'+
                '<div class="mut">'+esc(un[l.unit_id]||'')+' · '+Math.round(l.duration_seconds/60)+' '+esc(t('minutes'))+'</div></div>'+
                (l.is_free_preview?'<span class="tag ok">'+esc(t('preview'))+'</span>':'')+
                (d&&d.completed_at?'<span class="tag ok">✓</span>':'')+
                '<a class="btn btn-s '+(d&&d.completed_at?'':'btn-p')+'" href="#/lesson/'+l.id+'">'+esc(t('open'))+'</a></div>';
            }).join('');
        });
      });
  });
}

function viewIssue(){

    db.rpc('officer_recent_payments',{p_limit:15}).catch(function(){ return []; }),
    db.select('courses','order=title_ar').catch(function(){ return []; }),
    db.select('subjects','order=sort_order').catch(function(){ return []; })
  ]).then(function(res){
    var pays=res[0]||[], courses=res[1]||[], subs=res[2]||[];
    var subOpts = subs.map(function(s){
      var c = courses.filter(function(x){ return x.id===s.course_id; })[0];
      var cn = c ? (lang==='ar'?c.title_ar:(c.title_en||c.title_ar)) : '';
      return '<label style="display:flex;gap:8px;align-items:center;margin:4px 0">'+
        '<input type="checkbox" value="'+s.id+'" style="width:auto;margin:0"> '+esc(s.title_ar)+' <span class="mut">('+esc(cn)+')</span></label>';
    }).join('');
    return '<h1>'+esc(t('issueCode'))+'</h1><div class="card">'+
      '<label>سجل الدفع</label>'+
      '<select id="i_pay"><option value="">— اختر سجل دفع —</option>'+
      pays.map(function(p){
        return '<option value="'+p.id+'" '+(p.id===payId?'selected':'')+'>'+
          esc(p.student_name)+' · '+esc(p.course)+' · '+p.amount+' '+esc(p.currency)+
          ' · '+new Date(p.at).toLocaleDateString(lang==='ar'?'ar-EG':'en-GB')+'</option>';
      }).join('')+'</select>'+
      '<label>'+esc(t('codeType'))+'</label>'+
      '<select id="i_type"><option value="assigned">'+esc(t('assigned'))+'</option>'+
        '<option value="voucher">'+esc(t('voucher'))+'</option><option value="campaign">'+esc(t('campaign'))+'</option></select>'+
      '<label>'+esc(t('scope'))+'</label>'+
      '<select id="i_scope"><option value="full">'+esc(t('fullCourse'))+'</option><option value="subs">'+esc(t('someSubjects'))+'</option></select>'+
      '<div id="i_subs" class="hidden" style="margin-top:8px;max-height:220px;overflow:auto;border:1px solid var(--bd);border-radius:10px;padding:8px">'+
        (subOpts||'<span class="mut">لا توجد مواد</span>')+'</div>'+
      '<div class="row">'+
        '<div class="grow"><label>'+esc(t('batchSize'))+'</label><input id="i_batch" type="number" min="1" max="500" value="1"></div>'+
        '<div class="grow"><label>'+esc(t('maxUses'))+'</label><input id="i_uses" type="number" min="1" value="1"></div>'+
        '<div class="grow"><label>'+esc(t('accessDays'))+'</label><input id="i_days" type="number" min="0" placeholder="∞"></div>'+
      '</div>'+
      '<label>'+esc(t('validUntil'))+'</label><input id="i_until" type="date">'+
      '<label>'+esc(t('notes'))+'</label><input id="i_notes">'+
      '<div class="row" style="margin-top:16px"><button class="btn btn-g" id="i_go">'+esc(t('issue'))+'</button></div>'+
    '</div><div id="i_out"></div>';
  });
}
function bindIssue(){
  $('#i_scope').onchange=function(){ $('#i_subs').classList.toggle('hidden', $('#i_scope').value!=='subs'); };
  $('#i_go').onclick=function(){
    var payId=$('#i_pay').value;
    if(!payId){ toast('اختر سجل دفع','bad'); return; }
    var subs=null;
    if($('#i_scope').value==='subs'){
      subs=[].slice.call($('#i_subs').querySelectorAll('input:checked')).map(function(i){ return i.value; });
      if(!subs.length){ toast('اختر مادة واحدة على الأقل','bad'); return; }
    }
    var until=$('#i_until').value? new Date($('#i_until').value+'T23:59:59Z').toISOString() : null;
    db.rpc('issue_activation_codes',{
      p_payment_id:payId,
      p_code_type:$('#i_type').value,
      p_batch_size:Number($('#i_batch').value||1),
      p_max_uses:Number($('#i_uses').value||1),
      p_valid_until:until,
      p_access_days:Number($('#i_days').value||0)||null,
      p_subject_ids:subs,
      p_notes:$('#i_notes').value.trim()||null
    }).then(function(rows){
      S.codes=(rows||[]).map(function(r){ return r.code; });
      renderIssueResult();
      toast('تم الإصدار','ok');
    }).catch(function(e){ toast(errMsg(e),'bad'); });
  };
  renderIssueResult();
}
function renderIssueResult(){
  var box=$('#i_out'); if(!box) return;
  if(!S.codes.length){ box.innerHTML=''; return; }
  box.innerHTML='<div class="card"><h2>⚠️ '+esc(t('issuedCodes'))+'</h2>'+
    '<div class="row" style="margin:10px 0">'+
      '<button class="btn btn-p" id="i_print">'+esc(t('printAll'))+'</button>'+
      '<button class="btn" id="i_copy">'+esc(t('copy'))+'</button></div>'+
    '<div class="grid">'+S.codes.map(function(c){ return '<div class="code">'+esc(c)+'</div>'; }).join('')+'</div></div>';
  $('#i_print').onclick=function(){
    $('#printArea').innerHTML='<h2 style="text-align:center">AL-MANARAH — أكواد التفعيل</h2>'+
      S.codes.map(function(c){
        return '<div class="pcard"><div>كود تفعيل</div><div class="c">'+esc(c)+'</div>'+
          '<div style="font-size:12px">almanarah · مرة واحدة</div></div>';
      }).join('');
    window.print();
  };
  $('#i_copy').onclick=function(){
    var txt=S.codes.join('\n');
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ toast(t('copied'),'ok'); });
    }else{
      var ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta);
      ta.select(); try{ document.execCommand('copy'); }catch(e){}
      ta.remove(); toast(t('copied'),'ok');
    }
  };
}

/* ==============================================================
   الموجّه
   ============================================================== */
var VIEWS = {
  home:viewStudentHome, catalog:viewCatalog, profile:viewProfile,
  desk:viewDesk, find:viewFind, pay:viewPay, issue:viewIssue, mycodes:viewMyCodes,
  admin:viewAdmin, users:viewUsers, payments:viewPayments, audit:viewAudit
};
var BINDERS = { home:bindStudentHome, find:bindFind, pay:bindPay, issue:bindIssue, users:bindUsers, profile:bindProfile };

function render(){
  applyChrome();
  if(!cfg){ renderSetup(); return; }
  if(!S.session){ renderAuth(); return; }

  var staff = S.roles.indexOf('enrollment_officer')>=0 || S.roles.indexOf('super_admin')>=0;
  var hash  = location.hash.replace(/^#\/?/,'');
  var path  = hash.split('?')[0];
  var seg   = path.split('/');
  var key   = seg[0] || (staff?'desk':'home');
  var arg   = seg[1] || null;

  function paint(viewHtml, binder, a){
    $('#app').innerHTML = shell(deskNav(), viewHtml);
    bindChrome();
    if(binder) binder(a);
  }
  function go(htmlPromise, binder){
    $('#view').innerHTML = '<div class="mut">…</div>';
    htmlPromise.then(function(html){
      S.route = key;
      paint(html, binder);
    }).catch(function(e){
      $('#view').innerHTML = '<div class="diag">'+esc(errMsg(e))+'</div>';
    });
  }

  if(key==='course'){ return go(viewCourse(arg), null); }
  if(key==='subject'){ return go(viewSubject(arg), null); }
  if(key==='lesson'){ return go(viewLesson(arg), bindLesson); }

  if(!VIEWS[key]) key = staff?'desk':'home';
  if(['admin','users','payments','audit'].indexOf(key)>=0 && S.roles.indexOf('super_admin')<0) key='desk';
  if(['desk','find','pay','issue','mycodes'].indexOf(key)>=0 && !staff) key='home';

  S.route = key;
  go(VIEWS[key](), BINDERS[key]);
}

function boot(){
  if(!cfg){ renderSetup(); return; }
  $('#app').innerHTML = '<div class="center"><div class="card mut">…</div></div>';
  loadMe().then(render).catch(function(e){
    $('#app').innerHTML = '<div class="center"><div class="card"><div class="diag">'+esc(errMsg(e))+'</div></div></div>';
  });
}

window.addEventListener('hashchange', function(){ if(cfg && S.session) render(); });
window.addEventListener('error', function(ev){
  if(!$('#app')) return;
  var d=document.createElement('div');
  d.className='diag';
  d.textContent='خطأ غير متوقع: '+(ev.message||'');
  $('#app').appendChild(d);
});
boot();
</script>
